
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>THIRAK | Secure Pass Activation</title>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px 14px;
  background: #31060b;
  color: #fff;
  font: 16px Arial, sans-serif;
  text-align: center;
}

h1 {
  color: #f0c36e;
  font-size: 42px;
  margin: 10px 0 2px;
  letter-spacing: 3px;
}

.subtitle {
  font-size: 11px;
  letter-spacing: 2px;
  color: #e6cfab;
}

.card {
  max-width: 470px;
  margin: 22px auto;
  padding: 20px 16px;
  background: white;
  color: #262626;
  border-radius: 15px;
}

h2 {
  font-size: 20px;
  color: #7d1227;
}

input, button {
  width: 100%;
  padding: 14px;
  font-size: 16px;
  border-radius: 9px;
  margin: 9px 0;
}

input {
  border: 1px solid #ccc;
}

button {
  background: #83152a;
  color: #fff;
  border: 0;
  font-weight: bold;
}

button:disabled {
  opacity: .5;
}

#reader {
  margin: 14px auto;
  max-width: 420px;
}

#result {
  white-space: pre-line;
  overflow-wrap: anywhere;
  padding: 15px;
  margin: 12px 0;
  border-radius: 9px;
  background: #eee;
}

.success {
  background: #d8f8df !important;
  color: #17632b;
}

.error {
  background: #ffe0e0 !important;
  color: #a31313;
}

.info {
  background: #e8efff !important;
  color: #223c76;
}

.count {
  font-size: 22px;
  font-weight: bold;
  color: #7d1227;
  margin: 10px 0;
}

.note {
  font-size: 12px;
  color: #666;
}
</style>
</head>

<body>

<h1>THIRAK</h1>
<div class="subtitle">THE GARBA MAHOTSAV</div>

<div class="card">

  <h2>CONTINUOUS PASS ACTIVATION</h2>

  <input
    id="pin"
    type="password"
    autocomplete="off"
    placeholder="Enter Admin PIN"
    aria-label="Admin PIN"
  >

  <button id="start" onclick="startScanner()">
    START CAMERA
  </button>

  <div id="reader"></div>

  <div id="result" class="info">
    Camera not started
  </div>

  <div id="count" class="count">
    Scanned count appears after first success
  </div>

  <p class="note">
    Activation only · No gate entry is marked
  </p>

</div>

<script>

const API =
  "https://script.google.com/macros/s/AKfycbxBEdYN8HdgVWQziMfvl7P0Ai_c7j6opVyniK1NLI6qNzF4U7A6AJc65Sohwn26Qh24jA/exec";

let scanner = null;
let busy = false;
let lastId = "";
let lastAt = 0;

const $ = id => document.getElementById(id);

function message(text, kind = "info") {
  $("result").textContent = text;
  $("result").className = kind;
}

function requestId() {
  return Array.from(
    crypto.getRandomValues(new Uint8Array(16)),
    b => b.toString(16).padStart(2, "0")
  ).join("");
}

function parseQR(raw) {
  const url = new URL(raw);

  if (
    url.origin !== "https://script.google.com" ||
    !url.pathname.endsWith("/exec")
  ) {
    throw Error("Not a THIRAK QR URL");
  }

  const id = url.searchParams.get("id");
  const token = url.searchParams.get("t");

  if (!/^THK-2026-\d{4}$/.test(id || "") || !token) {
    throw Error("Invalid THIRAK pass QR");
  }

  return id;
}

async function startScanner() {

  if (!$("pin").value.trim()) {
    message("Enter Admin PIN first", "error");
    return;
  }

  if (typeof Html5Qrcode === "undefined") {
    message("Scanner library unavailable", "error");
    return;
  }

  $("start").disabled = true;

  try {

    scanner = new Html5Qrcode("reader");

    await scanner.start(
      { facingMode: "environment" },
      {
        fps: 10,
        qrbox: {
          width: 230,
          height: 230
        }
      },
      onScan,
      () => {}
    );

    message(
      "Camera ready. Scan a printed THIRAK QR."
    );

  } catch (err) {

    $("start").disabled = false;

    message(
      "Camera error: " + err,
      "error"
    );
  }
}

function onScan(raw) {

  if (busy) return;

  let id;

  try {
    id = parseQR(raw);
  } catch (err) {
    message(err.message, "error");
    return;
  }

  if (
    id === lastId &&
    Date.now() - lastAt < 5000
  ) {
    return;
  }

  lastId = id;
  lastAt = Date.now();
  busy = true;

  if (scanner) {
    scanner.pause(true);
  }

  message(
    "Processing " + id + "...",
    "info"
  );

  const rid = requestId();

  const payload = {
    action: "activate",
    requestId: rid,
    qrText: raw,
    adminPin: $("pin").value
  };

  // Send activation request.
  // no-cors does not confirm success.
  fetch(API, {
    method: "POST",
    mode: "no-cors",
    headers: {
      "Content-Type": "text/plain"
    },
    body: JSON.stringify(payload)
  }).catch(() => {});

  // Check server result separately.
  pollResult(rid, 0)

    .then(result => {

      if (result.ok) {

        message(
          result.message,
          "success"
        );

        if (
          typeof result.totalScanned === "number"
        ) {
          $("count").textContent =
            "Total Scanned: " +
            result.totalScanned +
            " / 2100";
        }

      } else {

        message(
          result.message || "Scan failed",
          "error"
        );

      }

    })

    .catch(() => {

      message(
        "No confirmed response. Check Google Sheet before retrying.",
        "error"
      );

    })

    .finally(() => {

      setTimeout(() => {
        busy = false;

        if (scanner) {
          scanner.resume();
        }

      }, 1200);

    });
}

function pollResult(rid, attempt) {

  if (attempt >= 25) {
    return Promise.reject(
      Error("Timed out")
    );
  }

  return new Promise(resolve =>
    setTimeout(resolve, 1000)
  )
    .then(() => jsonpResult(rid))
    .then(result =>
      result.pending
        ? pollResult(rid, attempt + 1)
        : result
    );
}

function jsonpResult(rid) {

  return new Promise((resolve, reject) => {

    const name = "thirakCallback_" + rid;

    const script = document.createElement("script");

    let done = false;

    const timeout = setTimeout(
      () => finish(Error("Response timeout")),
      4500
    );

    function finish(value) {

      if (done) return;

      done = true;

      clearTimeout(timeout);

      delete window[name];

      script.remove();

      if (value instanceof Error) {
        reject(value);
      } else {
        resolve(value);
      }
    }

    window[name] = value => finish(value);

    script.onerror = () =>
      finish(Error("Response unavailable"));

    script.src =
      API +
      "?mode=scanresult" +
      "&requestId=" + rid +
      "&callback=" + name +
      "&_=" + Date.now();

    document.head.appendChild(script);

  });
}

</script>

</body>
</html>
