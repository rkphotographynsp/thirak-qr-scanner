
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>THIRAK | Secure QR Scanner</title>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 20px 14px;
  background: #31060b;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

h1 {
  color: #f0c36e;
  font-size: 42px;
  letter-spacing: 3px;
  margin: 10px 0 3px;
}

.subtitle {
  color: #e6cfab;
  font-size: 11px;
  letter-spacing: 2px;
}

.card {
  max-width: 470px;
  margin: 22px auto;
  padding: 20px 16px;
  background: white;
  color: #262626;
  border-radius: 15px;
}

h2 {
  color: #7d1227;
  font-size: 20px;
}

input, button, select {
  width: 100%;
  padding: 14px;
  margin: 9px 0;
  font-size: 16px;
  border-radius: 9px;
}

input, select {
  border: 1px solid #ccc;
}

button {
  background: #83152a;
  color: white;
  border: 0;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

#reader {
  margin: 14px auto;
  max-width: 420px;
}

#result {
  white-space: pre-line;
  overflow-wrap: anywhere;
  padding: 15px;
  margin: 12px 0;
  border-radius: 9px;
  background: #eee;
}

.success {
  background: #d8f8df !important;
  color: #17632b;
}

.error {
  background: #ffe0e0 !important;
  color: #a31313;
}

.info {
  background: #e8efff !important;
  color: #223c76;
}

.count {
  color: #7d1227;
  font-size: 22px;
  font-weight: bold;
  margin: 12px 0;
}

.note {
  font-size: 12px;
  color: #666;
  line-height: 1.6;
}

.test-label {
  color: #17632b;
  font-weight: bold;
}

.live-label {
  color: #a31313;
  font-weight: bold;
}
</style>
</head>

<body>

<h1>THIRAK</h1>
<div class="subtitle">THE GARBA MAHOTSAV</div>

<div class="card">

<h2>SECURE PASS SCANNER</h2>

<label for="mode">Scanning Mode</label>

<select id="mode" onchange="changeMode()">
  <option value="test">SAFE TEST MODE</option>
  <option value="activate">LIVE PASS ACTIVATION</option>
</select>

<div id="modeLabel" class="test-label">
  TEST MODE — No Pass Activation
</div>

<input
  id="pin"
  type="password"
  autocomplete="off"
  placeholder="Enter Admin PIN"
  aria-label="Admin PIN"
>

<button id="start" onclick="startScanner()">
  START CAMERA
</button>

<div id="reader"></div>

<h3>Manual QR Test</h3>

<input
  id="qrInput"
  type="text"
  autocomplete="off"
  placeholder="Paste Test Verification URL"
>

<button id="manualBtn" onclick="manualScan()">
  TEST URL WITHOUT CAMERA
</button>

<div id="result" class="info">
  Select Test Mode and enter Admin PIN.
</div>

<div id="count" class="count">
  Total Scanned: Not loaded
</div>

<p class="note">
  Test Mode does not change pass status or scan count.
  Live Mode activates passes.
  Gate Entry 24 and Entry 25 are not marked.
</p>

</div>

<script>
const API =
  "https://script.google.com/macros/s/AKfycbxBEdYN8HdgVWQziMfvl7P0Ai_c7j6opVyniK1NLI6qNzF4U7A6AJc65Sohwn26Qh24jA/exec";

let scanner = null;
let busy = false;
let lastId = "";
let lastAt = 0;
let liveConfirmed = false;

const $ = id => document.getElementById(id);

function message(text, kind = "info") {
  $("result").textContent = text;
  $("result").className = kind;
}

function currentMode() {
  return $("mode").value;
}

function changeMode() {
  if (busy) return;

  const mode = currentMode();
  liveConfirmed = false;

  if (mode === "test") {
    $("modeLabel").textContent =
      "TEST MODE — No Pass Activation";
    $("modeLabel").className = "test-label";
    $("manualBtn").textContent =
      "TEST URL WITHOUT CAMERA";

    message(
      "Safe Test Mode selected. Only THK-TEST-001 is allowed."
    );
  } else {
    $("modeLabel").textContent =
      "LIVE MODE — Real Pass Activation";
    $("modeLabel").className = "live-label";
    $("manualBtn").textContent =
      "ACTIVATE PASTED PASS";

    message(
      "WARNING: Live Mode will activate a real pass.",
      "error"
    );
  }
}

function requestId() {
  return Array.from(
    crypto.getRandomValues(new Uint8Array(16)),
    b => b.toString(16).padStart(2, "0")
  ).join("");
}

function parseQR(raw, mode) {
  let url;

  try {
    url = new URL(raw);
  } catch (err) {
    throw Error("Invalid QR URL");
  }

  if (
    url.origin !== "https://script.google.com" ||
    url.pathname !== new URL(API).pathname
  ) {
    throw Error("Not a THIRAK QR URL");
  }

  const id = url.searchParams.get("id");
  const token = url.searchParams.get("t");

  if (!id || !token) {
    throw Error("QR ID or Token missing");
  }

  if (mode === "test") {
    if (id !== "THK-TEST-001") {
      throw Error("Only THK-TEST-001 allowed in Test Mode");
    }
  } else {
    if (!/^THK-2026-\d{4}$/.test(id)) {
      throw Error("Invalid Live Pass ID");
    }
  }

  return id;
}

function confirmLive() {
  if (currentMode() !== "activate") {
    return true;
  }

  if (liveConfirmed) {
    return true;
  }

  const approved = confirm(
    "LIVE ACTIVATION\n\n" +
    "Real passes will be activated and marked scanned.\n" +
    "Continue?"
  );

  if (approved) {
    liveConfirmed = true;
  }

  return approved;
}

async function startScanner() {
  if (busy) return;

  if (!$("pin").value.trim()) {
    message("Enter Admin PIN first", "error");
    return;
  }

  if (!confirmLive()) return;

  if (scanner) {
    message("Camera already started", "info");
    return;
  }

  if (typeof Html5Qrcode === "undefined") {
    message("QR scanner library unavailable", "error");
    return;
  }

  $("start").disabled = true;

  try {
    scanner = new Html5Qrcode("reader");

    await scanner.start(
      { facingMode: "environment" },
      {
        fps: 10,
        qrbox: {
          width: 230,
          height: 230
        }
      },
      onScan,
      () => {}
    );

    message(
      "Camera ready. Scan a THIRAK QR.",
      "info"
    );

  } catch (err) {
    $("start").disabled = false;
    scanner = null;

    message(
      "Camera Error: " + err.message,
      "error"
    );
  }
}

function manualScan() {
  if (busy) return;

  const raw = $("qrInput").value.trim();

  if (!raw) {
    message("Paste a Verification URL first", "error");
    return;
  }

  onScan(raw);
}

async function onScan(raw) {
  if (busy) return;

  const mode = currentMode();

  if (!$("pin").value.trim()) {
    message("Enter Admin PIN first", "error");
    return;
  }

  let id;

  try {
    id = parseQR(raw, mode);
  } catch (err) {
    message(err.message, "error");
    return;
  }

  if (!confirmLive()) return;

  if (
    id === lastId &&
    Date.now() - lastAt < 5000
  ) {
    return;
  }

  lastId = id;
  lastAt = Date.now();
  busy = true;

  $("mode").disabled = true;
  $("manualBtn").disabled = true;

  if (scanner) {
    try {
      scanner.pause(true);
    } catch (err) {}
  }

  message(
    "Processing " + id + "...",
    "info"
  );

  const rid = requestId();

  const payload = {
    action: mode,
    requestId: rid,
    qrText: raw,
    adminPin: $("pin").value
  };

  try {
    await fetch(API, {
      method: "POST",
      mode: "no-cors",
      headers: {
        "Content-Type": "text/plain"
      },
      body: JSON.stringify(payload)
    });

    const result = await pollResult(rid, 0);

    if (result.ok === true) {
      message(result.message, "success");

      if (
        mode === "activate" &&
        typeof result.totalScanned === "number"
      ) {
        $("count").textContent =
          "Total Scanned: " +
          result.totalScanned +
          " / 2100";
      }

    } else {
      message(
        result.message || "Verification failed",
        "error"
      );
    }

  } catch (err) {
    message(
      "No confirmed server response.\n" +
      "Check Google Sheet before retrying.\n" +
      err.message,
      "error"
    );

  } finally {
    setTimeout(() => {
      busy = false;
      $("mode").disabled = false;
      $("manualBtn").disabled = false;

      if (scanner) {
        try {
          scanner.resume();
        } catch (err) {}
      }
    }, 1200);
  }
}

function pollResult(rid, attempt) {
  if (attempt >= 25) {
    return Promise.reject(
      Error("Server response timed out")
    );
  }

  return new Promise(resolve => {
    setTimeout(resolve, 1000);
  })
  .then(() => jsonpResult(rid))
  .then(result => {
    if (result.pending) {
      return pollResult(rid, attempt + 1);
    }

    return result;
  });
}

function jsonpResult(rid) {
  return new Promise((resolve, reject) => {
    const name = "thirakCallback_" + rid;
    const script = document.createElement("script");

    let done = false;

    const timeout = setTimeout(
      () => finish(Error("Response timeout")),
      4500
    );

    function finish(value) {
      if (done) return;

      done = true;
      clearTimeout(timeout);

      delete window[name];
      script.remove();

      if (value instanceof Error) {
        reject(value);
      } else {
        resolve(value);
      }
    }

    window[name] = value => finish(value);

    script.onerror = () =>
      finish(Error("Response unavailable"));

    script.src =
      API +
      "?mode=scanresult" +
      "&requestId=" + rid +
      "&callback=" + name +
      "&_=" + Date.now();

    document.head.appendChild(script);
  });
}

changeMode();
</script>

</body>
</html>
