
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>THIRAK | Secure Pass Activation</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 20px 14px;
  background: #31060b;
  color: white;
  font: 16px Arial, sans-serif;
  text-align: center;
}
h1 {
  color: #f0c36e;
  font-size: 42px;
  margin: 10px 0 2px;
  letter-spacing: 3px;
}
.subtitle {
  font-size: 11px;
  letter-spacing: 2px;
  color: #e6cfab;
}
.card {
  max-width: 470px;
  margin: 22px auto;
  padding: 20px 16px;
  background: white;
  color: #262626;
  border-radius: 15px;
}
h2 {
  font-size: 20px;
  color: #7d1227;
}
input[type=password], button {
  width: 100%;
  padding: 14px;
  font-size: 16px;
  border-radius: 9px;
  margin: 9px 0;
}
input[type=password] {
  border: 1px solid #ccc;
}
button {
  background: #83152a;
  color: white;
  border: 0;
  font-weight: bold;
}
button:disabled { opacity: .5; }
label {
  display: block;
  font-size: 14px;
  margin: 12px 0;
}
#reader {
  margin: 14px auto;
  max-width: 420px;
}
#result {
  white-space: pre-line;
  overflow-wrap: anywhere;
  padding: 15px;
  margin: 12px 0;
  border-radius: 9px;
  background: #eee;
  font-weight: bold;
}
.success {
  background: #d8f8df !important;
  color: #17632b;
}
.error {
  background: #ffe0e0 !important;
  color: #a31313;
}
.warn {
  background: #fff3cd !important;
  color: #7a5b00;
}
.info {
  background: #e8efff !important;
  color: #223c76;
}
.count {
  font-size: 24px;
  font-weight: bold;
  color: #7d1227;
  margin: 10px 0;
}
.note {
  font-size: 12px;
  color: #666;
  line-height: 1.5;
}
</style>
</head>

<body>
<h1>THIRAK</h1>
<div class="subtitle">THE GARBA MAHOTSAV</div>

<div class="card">
  <h2>CONTINUOUS PASS ACTIVATION</h2>

  <input
    id="pin"
    type="password"
    autocomplete="off"
    placeholder="Enter Admin PIN"
    aria-label="Admin PIN"
  >

  <label>
    <input id="testMode" type="checkbox" checked
           onchange="modeChanged()">
    SAFE TEST MODE (No Sheet Changes)
  </label>

  <button id="start" onclick="startScanner()">
    START CAMERA
  </button>

  <button id="stop" onclick="stopScanner()" disabled>
    STOP CAMERA
  </button>

  <div id="reader"></div>

  <div id="result" class="info">
    SAFE TEST MODE ON. Only THK-TEST-001 allowed.
  </div>

  <div id="count" class="count">
    Total Scanned: - / 2100
  </div>

  <p class="note">
    Test Mode: No pass activation or count changes.
    Live Mode: Real pass activation.
    Gate Entry 24 and Entry 25 remain untouched.
  </p>
</div>

<script>
const API =
  "https://script.google.com/macros/s/AKfycbxBEdYN8HdgVWQziMfvl7P0Ai_c7j6opVyniK1NLI6qNzF4U7A6AJc65Sohwn26Qh24jA/exec";

const $ = id => document.getElementById(id);

let scanner = null;
let busy = false;
let lastId = "";
let lastAt = 0;
let approvedLive = false;
let lockedMode = "test";

function message(text, kind = "info") {
  $("result").textContent = text;
  $("result").className = kind;
}

function modeChanged() {
  if (busy || scanner) {
    $("testMode").checked = lockedMode === "test";
    message("Stop camera before changing mode.", "warn");
    return;
  }

  if (!$("testMode").checked) {
    const approved = confirm(
      "WARNING: LIVE ACTIVATION\n\n" +
      "Real printed passes will be activated.\n" +
      "Continue?"
    );

    if (!approved) {
      $("testMode").checked = true;
    }
  }

  lockedMode = $("testMode").checked
    ? "test"
    : "activate";

  approvedLive = lockedMode === "activate";

  message(
    lockedMode === "test"
      ? "SAFE TEST MODE ON. Scan THK-TEST-001."
      : "LIVE MODE ON. Real passes will be activated.",
    lockedMode === "test" ? "info" : "warn"
  );
}

function newRequestId() {
  return Array.from(
    crypto.getRandomValues(new Uint8Array(16)),
    b => b.toString(16).padStart(2, "0")
  ).join("");
}

function parseQR(raw, mode) {
  let url;

  try {
    url = new URL(raw);
  } catch (err) {
    throw Error("Invalid QR URL");
  }

  const expected = new URL(API);

  if (
    url.origin !== expected.origin ||
    url.pathname !== expected.pathname
  ) {
    throw Error("Not a THIRAK QR URL");
  }

  const id = url.searchParams.get("id");
  const token = url.searchParams.get("t");

  if (!id || !token) {
    throw Error("QR ID or Token missing");
  }

  if (mode === "test") {
    if (id !== "THK-TEST-001") {
      throw Error("Only THK-TEST-001 allowed in Test Mode");
    }
  } else {
    if (!/^THK-2026-\d{4}$/.test(id)) {
      throw Error("Invalid Live Pass ID");
    }
  }

  return id;
}

function beep(ok) {
  try {
    const AudioCtx =
      window.AudioContext || window.webkitAudioContext;

    const ctx = new AudioCtx();
    const oscillator = ctx.createOscillator();

    oscillator.frequency.value = ok ? 880 : 300;
    oscillator.connect(ctx.destination);
    oscillator.start();

    setTimeout(() => {
      oscillator.stop();
      ctx.close();
    }, ok ? 150 : 400);

  } catch (err) {}

  if (navigator.vibrate) {
    navigator.vibrate(
      ok ? 100 : [200, 100, 200]
    );
  }
}

async function startScanner() {
  if (busy || scanner) return;

  if (!$("pin").value.trim()) {
    message("Enter Admin PIN first", "error");
    return;
  }

  if (typeof Html5Qrcode === "undefined") {
    message("Scanner library not loaded", "error");
    return;
  }

  const mode = $("testMode").checked
    ? "test"
    : "activate";

  if (mode === "activate" && !approvedLive) {
    message("Live Mode not confirmed", "error");
    return;
  }

  lockedMode = mode;
  $("start").disabled = true;
  $("testMode").disabled = true;

  try {
    scanner = new Html5Qrcode("reader");

    await scanner.start(
      { facingMode: "environment" },
      {
        fps: 10,
        qrbox: {
          width: 230,
          height: 230
        }
      },
      onScan,
      () => {}
    );

    $("stop").disabled = false;

    message(
      mode === "test"
        ? "Camera ready. Scan THK-TEST-001."
        : "LIVE CAMERA READY. Scan printed passes.",
      mode === "test" ? "info" : "warn"
    );

  } catch (err) {
    scanner = null;
    $("start").disabled = false;
    $("testMode").disabled = false;

    message("Camera error: " + err, "error");
  }
}

async function stopScanner() {
  if (!scanner || busy) return;

  $("stop").disabled = true;

  try {
    await scanner.stop();
    scanner.clear();
  } catch (err) {
    message("Camera stop error: " + err, "error");
  }

  scanner = null;
  $("start").disabled = false;
  $("testMode").disabled = false;

  message("Camera stopped", "info");
}

async function onScan(raw) {
  if (busy) return;

  const mode = lockedMode;
  let id;

  try {
    id = parseQR(raw, mode);
  } catch (err) {
    message(err.message, "error");
    return;
  }

  if (!$("pin").value.trim()) {
    message("Admin PIN missing", "error");
    return;
  }

  if (
    id === lastId &&
    Date.now() - lastAt < 5000
  ) {
    return;
  }

  lastId = id;
  lastAt = Date.now();
  busy = true;

  if (scanner) {
    try { scanner.pause(true); }
    catch (err) {}
  }

  message("Processing " + id + "...", "info");

  const rid = newRequestId();

  const payload = {
    action: mode,
    requestId: rid,
    qrText: raw,
    adminPin: $("pin").value
  };

  try {
    await fetch(API, {
      method: "POST",
      mode: "no-cors",
      headers: {
        "Content-Type": "text/plain"
      },
      body: JSON.stringify(payload)
    });

    const result = await pollResult(rid, 0);

    if (result.ok === true) {
      message(result.message, "success");
      beep(true);

      if (
        mode === "activate" &&
        typeof result.totalScanned === "number"
      ) {
        $("count").textContent =
          "Total Scanned: " +
          result.totalScanned +
          " / 2100";
      }

    } else {
      const msg = result.message || "Scan failed";

      message(
        msg,
        /ALREADY/i.test(msg) ? "warn" : "error"
      );

      beep(false);
    }

  } catch (err) {
    message(
      "No confirmed server response.\n" +
      "Check Google Sheet before retrying.",
      "error"
    );

    beep(false);

  } finally {
    setTimeout(() => {
      busy = false;

      if (scanner) {
        try { scanner.resume(); }
        catch (err) {}
      }
    }, 1200);
  }
}

function pollResult(rid, attempt) {
  if (attempt >= 25) {
    return Promise.reject(
      Error("Server response timed out")
    );
  }

  return new Promise(resolve => {
    setTimeout(resolve, 1000);
  })
  .then(() => jsonpResult(rid))
  .then(result => {
    if (result && result.pending) {
      return pollResult(rid, attempt + 1);
    }

    return result;
  });
}

function jsonpResult(rid) {
  return new Promise((resolve, reject) => {
    const name = "thirakCallback_" + rid;
    const script = document.createElement("script");

    let done = false;

    const timer = setTimeout(
      () => finish(Error("Response timeout")),
      4500
    );

    function finish(value) {
      if (done) return;

      done = true;
      clearTimeout(timer);
      delete window[name];
      script.remove();

      if (value instanceof Error) {
        reject(value);
      } else {
        resolve(value);
      }
    }

    window[name] = value => finish(value);

    script.onerror = () =>
      finish(Error("Response unavailable"));

    script.src =
      API +
      "?mode=scanresult" +
      "&requestId=" + rid +
      "&callback=" + name +
      "&_=" + Date.now();

    document.head.appendChild(script);
  });
}
</script>
</body>
</html>
